.dpCt button{height:38px;border:0;border-radius:9px;background:#1a2658;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer}

.dpCt svg{width:15px;height:15px;flex-shrink:0}
.dpRoute{display:flex;align-items:center;direction:rtl;gap:8px;margin:12px 12px 8px;font-size:17px;font-weight:800;color:#10244f}
.dpRoute svg{width:18px;height:18px;stroke:#0f2a6b;stroke-width:2;fill:none;flex-shrink:0}
.dpRoute em{font-style:normal;color:#f08a00;font-size:15px}
.dpInfo{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:0 8px;direction:rtl}
.dpInfo>div{background:#eef1f6;border-radius:9px;padding:8px 4px 7px;text-align:center;min-width:0}
.dpInfo small{display:block;font-size:10px;color:#7b8499;font-weight:500}
.dpInfo b{display:block;font-size:15px;font-weight:800;color:#1b2547;margin-top:2px;white-space:nowrap}
.dpInfo>div.pr{background:#fdf3d6;border:2px solid #e8b53a}
.dpInfo>div.pr b{color:#a9741a;font-size:18px}
.dpInfo>div.pr s{font-size:11px;color:#6b7690;font-weight:600}
.dpH{display:flex;align-items:center;direction:rtl;gap:7px;margin:14px 12px 7px;font-size:14.5px;font-weight:800;color:#1b2f66}
.dpH:before{content:"";width:7px;height:7px;border-radius:50%;background:#f08a00;flex-shrink:0}
.dpH.sm{font-size:12.5px;margin-top:12px}
.dpLoc{margin:0 8px;background:#1a2658;color:#fff;border-radius:8px;padding:10px 12px;display:flex;align-items:center;direction:rtl;gap:8px;font-size:11.5px;font-weight:700}
.dpLoc svg{width:14px;height:14px;stroke:#f2b93b;stroke-width:2.2;fill:none;flex-shrink:0}
.dpPath{margin:0 8px;background:#fff;border:1px solid #e3e9f3;border-radius:10px;padding:10px 4px 6px;direction:rtl}
.dpTl{display:flex;position:relative}
.dpTl:before{content:"";position:absolute;top:11px;right:5%;left:5%;border-top:2px solid #eadcb4}
.dpTl>div{position:relative;flex:1;min-width:0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px}
.dpTl i{width:22px;height:22px;border-radius:50%;background:#1a2658;color:#fff;font-style:normal;font-size:11px;font-weight:800;display:grid;place-items:center}
.dpTl>div:first-child i,.dpTl>div:last-child i{background:#f5a623}
.dpTl b{font-size:8.5px;font-weight:700;color:#1b2f66;line-height:1.25;overflow-wrap:anywhere}
.dpPath small{display:block;text-align:center;font-size:8.5px;color:#8a94a8;margin-top:8px}
.dpFine{margin:8px 12px 0;font-size:10px;line-height:1.7;color:#6b7690;direction:rtl;text-align:right}
.dpCta{margin:10px 8px 0}
.dpCta button{width:100%;height:42px;border:0;border-radius:10px;background:#1a2658;color:#fff;font-size:15px;font-weight:800;cursor:pointer}
.dpTbl{margin:0 8px}
.dpTbl .dpH{margin:12px 4px 7px}
.dpR{display:flex;direction:rtl;background:#fff;border:1px solid #d9dfe9;border-radius:10px;margin-bottom:8px}
.dpR>div{flex:1;min-width:0;padding:8px 7px;font-size:10.5px;color:#1b2547;display:flex;flex-wrap:wrap;align-items:center;gap:1px 4px;line-height:1.35}
.dpR>div+div{border-right:1px solid #d9dfe9}
.dpR>div span{font-weight:600}
.dpR>div b{font-weight:800}
.dpR>div b.or{color:#f08a00;font-size:14px}
.dpR>div s{font-size:10px;color:#8a4a2f;font-weight:600}
.dpHero.svc{aspect-ratio:497/170}
.dpTW{display:grid;grid-template-columns:1fr 1fr;direction:rtl;margin:12px 0 10px;border-top:2px solid #d3d9e4}
.dpTW>div{padding:14px 13px 6px;min-width:0}
.dpTW>div:first-child{border-left:1.5px solid #cfd6e2}
.dpTW .ic2{width:42px;height:42px;border-radius:50%;border:1.5px solid #5b6784;display:grid;place-items:center;margin:0 auto 6px;color:#5b6784}
.dpTW .ic2 svg{width:22px;height:22px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dpTW h5{font-size:14.5px;font-weight:800;color:#10244f;text-align:center;margin:0 0 10px}
.dpTW p{position:relative;font-size:12.5px;line-height:1.85;color:#33466f;padding-right:12px;margin:0 0 8px;font-weight:600;font-family:inherit}
.dpTW p:before{content:"";position:absolute;right:0;top:9px;width:4px;height:4px;border-radius:50%;background:#10244f}
.dpTW .w .ic2{width:46px;height:46px;border:2.5px solid #c81e1e;color:#c81e1e}
.dpTW .w h5{color:#c81e1e}
.dpTW .w p{color:#b91c1c;font-weight:700}
.dpTW .w p:before{background:#c81e1e}
.dpSup{display:flex;align-items:center;direction:rtl;gap:12px;background:#f1f3f8;border-top:1px solid #dfe5ef;border-bottom:1px solid #dfe5ef;padding:13px 14px;margin:0 0 4px}
.dpSup .sh{width:40px;height:40px;border-radius:12px;background:#fff;border:1px solid #d9e0ec;display:grid;place-items:center;flex-shrink:0}
.dpSup .sh svg{width:24px;height:24px;stroke:#0f2a6b;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dpSup b{display:block;font-size:14px;font-weight:800;color:#10244f}
.dpSup small{display:block;font-size:11px;color:#667794;margin-top:2px;line-height:1.6}
.dpInfo.wr b{white-space:normal;font-size:13px;line-height:1.35}
.dpInfo.wr>div.pr b{font-size:16px}
/* صفحة الرحلة الموحّدة */
.dpInfo.one{grid-template-columns:1.2fr 1fr 1fr 1fr 1fr;gap:5px}
.dpInfo.one>div{padding:7px 2px 6px;display:flex;flex-direction:column;justify-content:center}
.dpInfo.one small{font-size:9.5px}
.dpInfo.one b{font-size:12.5px}
.dpInfo.one>div.pr b{font-size:15px}
.dp.trip .dpRoute .tno{margin-inline-start:6px;font-size:13px;color:#33466f;font-weight:600}
.dp.trip .dpTW{min-height:210px;align-items:start;margin-bottom:8px}
.dpTW.one{grid-template-columns:1fr}
.dpTW.one>div:first-child{border-left:0}
.dpTW.one>div{padding-inline:22px}
/* صفحة الخدمات */
.dpTtl p.loc{display:flex;align-items:center;gap:4px;font-size:12.5px;color:#10244f;font-weight:700;margin-top:3px}
.dpTtl p.loc svg{width:13px;height:13px;stroke:#0f2a6b;stroke-width:2.2;fill:none;flex-shrink:0}
.dp.svcp{display:flex;flex-direction:column;min-height:calc(100dvh - 150px)}
.dp.svcp .dpTW{min-height:220px;align-items:start;margin-bottom:8px}
.dp.svcp .dpFine{margin-top:auto;padding-top:14px}
.dpTW .lc{padding:14px 13px 6px;min-width:0}
.dpTW .lc>div+div{margin-top:14px}
.dpTW .g .ic2{border:0;color:#16a34a;width:42px;height:34px}
.dpTW .g h5{color:#16a34a}
.dpTW .g p{color:#15803d;font-weight:700}
.dpTW .g p:before{background:#16a34a}



.fg>*,.edg>*,#pg,#mn{min-width:0}.fg input,.fg select,.fg textarea{width:100%;min-width:0}



#pg{padding-bottom:96px}.row{flex-wrap:wrap}.card>.hd{margin-bottom:12px!important}

.edp{position:sticky;top:62px;z-index:6;margin-bottom:14px}.edp .card{margin:0;padding:12px 14px;max-height:44vh;overflow:auto;box-shadow:0 8px 24px #0f2a6b22}.edp.mini .pvb{display:none}.edp .pvb{margin-top:4px}
@media(max-width:900px){.edp{top:56px}.edp .card{max-height:38vh}}

.rg-wrap{position:fixed;inset:0;z-index:40;overflow-y:auto;overflow-x:hidden;background:linear-gradient(180deg,#f3f8ff,#fbfdff);-webkit-overflow-scrolling:touch}
.rg-panel{width:100%;max-width:760px;margin:0 auto;background:#f7faff;min-height:100%;box-shadow:0 0 30px #123d7014}
.rg-banner{display:block;width:100%;height:auto;background:#fff}
.rg-band{background:linear-gradient(90deg,#0e4a91,#165aa3);color:#fff;padding:17px 22px 15px;text-align:right}
.rg-band b{display:block;font-size:clamp(22px,5.4vw,30px);font-weight:800;line-height:1.3}
.rg-band small{display:block;margin-top:3px;font-size:clamp(11.5px,2.9vw,14px);color:#d3e3f7;font-weight:500}
.rg-card{margin:14px clamp(8px,2.2vw,16px) 0;background:#fff;border-radius:16px;padding:clamp(10px,2.4vw,16px);box-shadow:0 4px 18px #1b4a8a1c;border:1px solid #e6eef9}
.rg-sec{display:flex;align-items:center;gap:11px;background:#e8f2fd;border-radius:11px;padding:11px 14px;margin:2px 0 14px}
.rg-sec svg{width:30px;height:30px;flex:none;color:#1d5fae}
.rg-sec b{display:block;color:#0f4a8e;font-size:clamp(15px,3.8vw,19px);font-weight:800;line-height:1.35}
.rg-sec small{display:block;color:#5f82ab;font-size:clamp(10.5px,2.6vw,12.5px);font-weight:500;margin-top:1px}
.rg-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px 11px;margin-bottom:18px}
.rg-grid>div{min-width:0;display:flex;flex-direction:column;justify-content:flex-end}
.rg-lb{display:flex;align-items:center;gap:6px;color:#15498a;font-weight:800;font-size:clamp(12px,3.1vw,14.5px);margin:0 0 7px;line-height:1.3}
.rg-lb svg{width:17px;height:17px;flex:none;color:#1d62b3}
.rg-card input.rg-in{height:48px;padding:0 13px;border:1.5px solid #cfe1f5;border-radius:12px;background:#fff;color:#16365f;font-size:clamp(12.5px,3.2vw,14.5px);text-overflow:ellipsis}
.rg-card input.rg-in::placeholder{color:#8fa1ba;opacity:1}
.rg-card input.rg-in:focus{border-color:#2a70b8;box-shadow:0 0 0 3px #2a70b822}
.rg-up{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-align:center;border:1.5px dashed #8dbdea;border-radius:12px;background:#f7fbff;padding:13px 6px;min-height:104px;flex:1;cursor:pointer;color:#14509a}
.rg-up svg{width:30px;height:30px;color:#1d62b3}
.rg-up b{font-size:clamp(11.5px,3vw,13.5px);font-weight:800;line-height:1.35}
.rg-up small{font-size:clamp(10px,2.6vw,11.5px);color:#2f6aa8;font-weight:500;line-height:1.35;word-break:break-word}
.rg-up.on{border-style:solid;border-color:#2a8a57;background:#f2fbf6}
.rg-up.on small{color:#1f7a4a;font-weight:700}
.rg-id{display:flex;align-items:center;justify-content:space-between;gap:8px;height:48px;border:1.5px solid #cfe1f5;border-radius:12px;background:#fff;padding:0 7px 0 11px;cursor:pointer;color:#14509a}
.rg-id b{font-size:clamp(11px,2.9vw,13.5px);font-weight:800;flex:1;text-align:center;line-height:1.3}
.rg-id i{flex:none;width:32px;height:32px;border-radius:8px;background:#1d5fb0;color:#fff;display:flex;align-items:center;justify-content:center}
.rg-id i svg{width:20px;height:20px}
.rg-id.on{border-color:#2a8a57;color:#1f7a4a}
.rg-id.on i{background:#2a8a57}
.rg-go{display:block;width:min(calc(100% - 44px),430px);margin:18px auto 0;height:56px;border-radius:11px;background:linear-gradient(180deg,#1259a8,#0d4687);color:#fff;font-size:clamp(19px,5vw,24px);font-weight:800;box-shadow:0 5px 14px #0d46874d}
.rg-go:active{transform:translateY(1px)}
.rg-note{margin:14px 10px 0;text-align:center;color:#e60000;font-weight:800;font-size:clamp(12.5px,3.4vw,16px);line-height:1.5}
.rg-help{display:flex;flex-direction:column;align-items:center;gap:2px;margin:12px auto 0;padding-bottom:calc(24px + env(safe-area-inset-bottom));color:#14509a;font-weight:800;font-size:clamp(11.5px,3vw,13.5px)}
.rg-help svg{width:36px;height:36px;color:#1d62b3}
.rg-lgn{padding:18px clamp(14px,4vw,24px) 6px}
.rg-lgn .rg-lb{margin-top:12px}
@media(max-width:359px){.rg-grid{grid-template-columns:1fr}}
@media(min-width:900px){.rg-wrap{padding:18px 0}.rg-panel{min-height:0;border-radius:18px;overflow:hidden;background:#f7faff;margin-bottom:18px}}

function PRV0(){return[{id:7,on:1,scope:'داخلية',from:'صنعاء',to:'عدن',days:'يومياً',time:'7:00 ص',ty:'سيدان',kind:'ذهاب',seats:4,price:60,old:70,tier:0,pick:'صنعاء - شارع الستين',feat:'سيارة نظيفة ومكيفة\nسائق محترف'},{id:6,on:1,scope:'دولية',from:'عدن',to:'جدة',days:'يومياً',time:'6:00 ص',ty:'دفع رباعي',kind:'ذهاب',seats:4,price:180,old:200,tier:1,pick:'عدن - كريتر',feat:'سيارة نظيفة ومكيفة\nسائق محترف\nانطلاق من باب البيت'}]}
function mig(){delete D.cat;delete D.pu;D.rm=D.rm||RM0();D.cd=D.cd||{};D.ord.forEach(o=>{if(!o.fd)o.fd=mkfd(o)});D.cfg=Object.assign({auto:0,rmReq:1,adv:2,maxp:9,nOrd:1,nChat:1,nRem:1,nAm:1,cur:'$',tax:0,rate:'',cancel:'',refund:'',terms:'',qr:null},D.cfg||{});D.ofr.priv=D.ofr.priv||PRV0();D.ofr.priv.forEach(o=>{o.scope=o.scope||'دولية'})}
const rmRow=r=>{const o=rmO(r),lo=o&&+r.amt<+o.tot;return`<div class="row" style="cursor:default;flex-wrap:wrap"><div class="ia">💳</div><div class="rm"><b>${h(r.name)} · ${(r.cur||'$').trim()}${r.amt}</b><small>${o?osn(o)+' · ':''}${h(r.bank||'—')} · مرجع ${h(r.ref||'—')} · المحوّل ${h(r.sender||'—')} · ${dt(r.date)}</small>${lo?`<small style="color:var(--rd)">⚠ أقل من إجمالي الطلب (${(o.cur||'$').trim()}${o.tot})</small>`:''}</div><span class="pl ${RMC[r.st]}">${RMS[r.st]}</span>${r.st==0?`<button class="bt g" onclick="rmc('${r.id}')">✓ تأكيد الحوالة</button><button class="bt r" onclick="rmr('${r.id}')">رفض</button>`:''}<button class="ib" onclick="rmd('${r.id}')">👁</button><button class="ib" onclick="pdfR('${r.id}')">📄</button></div>`};
const rmCard=o=>{const R=D.rm.filter(r=>r.oid==o.id);return`<div class="card"><div class="hd" style="margin:0 0 6px"><div><h3 style="margin:0">الدفع والحوالات</h3></div><button class="bt s" onclick="rmn('${o.id}')">+ تسجيل حوالة</button></div>${R.map(rmRow).join('')||'<p class="em">لم تصل حوالة لهذا الطلب بعد</p>'}</div>`};
function rmp(){const t=F.rt??0,A=D.rm,Q=F.rq||'',Ls=A.filter(r=>(t=='all'||r.st==t)&&(!Q||[r.name,r.ph,r.ref,r.sender,r.id].join(' ').includes(Q))).sort((a,b)=>b.ts-a.ts);
return hd('حوالات العملاء','سندات التحويل التي أرسلها العملاء عند الدفع؛ تتحقق من وصول المبلغ ثم تؤكد الحوالة فيبدأ تنفيذ الطلب',`<button class="bt g" onclick="rmn()">+ تسجيل حوالة</button>`)+`<div class="gr" style="margin-bottom:14px">${[['⏳','بانتظار التأكيد',0],['✅','مؤكدة',1],['⛔','مرفوضة',2]].map(k=>`<div class="card" style="margin:0"><b style="font-size:22px">${k[0]} ${A.filter(r=>r.st==k[2]).length}</b><div>${k[1]}</div><small style="color:var(--mu)">${rsum(A.filter(r=>r.st==k[2]))}</small></div>`).join('')}</div><div class="tb">${[[0,'بانتظار التأكيد'],[1,'مؤكدة'],[2,'مرفوضة'],['all','الكل']].map(x=>`<button class="${t==x[0]?'on':''}" onclick="F.rt='${x[0]}';go()">${x[1]}</button>`).join('')}</div><input placeholder="ابحث بالاسم أو الجوال أو رقم الحوالة..." value="${h(Q)}" style="margin-bottom:12px" onchange="F.rq=this.value;go()"><div class="card">${Ls.map(rmRow).join('')||'<p class="em">لا توجد حوالات</p>'}</div>`}
function rmc(id){const r=D.rm.find(x=>x.id==id),o=rmO(r);if(o&&+r.amt<+o.tot&&!confirm('المبلغ المحوّل أقل من إجمالي الطلب. تأكيد الحوالة؟'))return;r.st=1;r.at=Date.now();if(o){if(o.st==5)o.st=1;const d=o.docs.find(x=>/سند/.test(x.n));if(d)d.ok=1;lg(o,'تأكيد الحوالة '+(r.ref||r.id))}say(r.ph,r.name,'تم استلام الحوالة وتأكيدها'+(o?' لطلبك '+osn(o):''));save();toast('تم تأكيد الحوالة وإشعار العميل');go()}
function rmr(id){const r=D.rm.find(x=>x.id==id),o=rmO(r),w=prompt('سبب رفض الحوالة (يصل العميل)؟');if(w==null)return;r.st=2;r.note=w;r.at=Date.now();if(o){if(o.st==1)o.st=5;lg(o,'رفض الحوالة '+(r.ref||r.id)+(w?': '+w:''))}say(r.ph,r.name,'لم نتمكن من تأكيد الحوالة'+(w?': '+w:'')+'، يرجى المراجعة');save();toast('تم رفض الحوالة');go()}
function rmd(id){const r=D.rm.find(x=>x.id==id),o=rmO(r);mo('حوالة '+r.id,`<div class="kv">${[['العميل',r.name],['الجوال',r.ph],['المبلغ',(r.cur||'$').trim()+r.amt],['الحساب',r.bank],['المرجع',r.ref],['المحوّل',r.sender],['التاريخ',dt(r.date)],['الطلب',o?osn(o):'—'],['الحالة',RMS[r.st]]].map(x=>`<div><small>${x[0]}</small><b>${h(x[1]||'—')}</b></div>`).join('')}</div>${r.rc?`<img src="${r.rc}" style="width:100%;border-radius:12px;margin-top:10px">`:'<p class="em">لا توجد صورة سند مرفقة</p>'}${r.note?`<div class="nt" style="margin-top:10px">${h(r.note)}</div>`:''}`,0,`<button class="bt s" onclick="pdfR('${id}')">📄 PDF</button>`)}

:t==1?`<div class="card"><div class="bn ${VC[p.ver]}">حالة التوثيق: ${VER[p.ver]}${ex?' · ⚠ الترخيص ينتهي قريباً أو منتهٍ':''}</div><div class="fg" style="margin-top:14px">${pi('lname','الاسم القانوني للمنشأة')}${pi('cr','رقم السجل التجاري')}${pi('lic','رقم ترخيص مكتب السفريات')}${pi('issuer','جهة الإصدار')}${pi('issued','تاريخ الإصدار','date')}${pi('expiry','تاريخ الانتهاء','date')}${pi('tax','الرقم الضريبي')}${pi('owner','اسم المالك / المدير المفوض')}${pi('ownerId','رقم هوية المالك')}</div><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="bt g" onclick="ps(['lname','cr','lic','issuer','issued','expiry','tax','owner','ownerId'])">حفظ البيانات القانونية</button><button class="bt o" onclick="vr()">طلب التوثيق</button></div></div><div class="card"><h3>وثائق المكتب</h3><div class="gr">${pu('licImg','صورة ترخيص المكتب')}${pu('crImg','صورة السجل التجاري')}${pu('idImg','صورة هوية المالك')}${pu('taxImg','شهادة التسجيل الضريبي')}</div></div>`
:t==2?`<div class="card"><h3>بيانات تسجيل الدخول</h3><div class="fg">${pi('user','اسم المستخدم')}${pi('lph','جوال تسجيل الدخول')}${pi('lem','بريد تسجيل الدخول','email')}</div><button class="bt g" style="margin-top:12px" onclick="ps(['user','lph','lem'])">حفظ بيانات الدخول</button></div><div class="card"><h3>${p.pwh?'تغيير كلمة المرور':'تعيين كلمة مرور'}</h3><div class="fg">${p.pwh?'<div class="w"><label>كلمة المرور الحالية</label><input id="w_o" type="password"></div>':''}<div><label>كلمة المرور الجديدة (8 أحرف على الأقل)</label><input id="w_n" type="password"></div><div><label>تأكيد كلمة المرور</label><input id="w_c" type="password"></div></div><button class="bt" style="margin-top:12px" onclick="pws()">حفظ كلمة المرور</button>${p.pwd?`<small style="color:var(--mu);margin-inline-start:10px">آخر تغيير: ${dt(p.pwd)}</small>`:''}<div class="nt" style="margin-top:14px">الحماية الحالية تعمل على هذا الجهاز فقط، وتصبح كاملة بعد ربط اللوحة بخادم.</div></div><div class="card"><div class="dr"><b>التحقق بخطوتين<br><small style="color:var(--mu)">يُفعَّل فعلياً بعد الربط بالخادم</small></b><label class="tg"><input type="checkbox" ${p.tfa?'checked':''} onchange="D.pf.tfa=this.checked?1:0;save()"><i></i></label></div>${p.pwh?`<button class="bt r" style="margin-top:12px" onclick="OK=0;go()">تسجيل الخروج من اللوحة</button>`:''}</div>`

function ps(K_){const p=D.pf;K_.forEach(k=>p[k]=$('#p_'+k).value.trim());if(!p.name)return toast('اكتب اسم المكتب');save();toast('تم الحفظ');go()}
function vr(){const p=D.pf;if(!p.lname||!p.cr||!p.lic||!p.owner||!p.licImg||!p.crImg)return toast('أكمل الاسم القانوني والسجل والترخيص والمالك وارفع صورتي الترخيص والسجل');p.ver=1;save();toast('تم إرسال طلب التوثيق');go()}
async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(unescape(encodeURIComponent(s)))}}
async function pws(){const n=$('#w_n').value,c=$('#w_c').value,o=$('#w_o');if(n.length<8)return toast('كلمة المرور 8 أحرف على الأقل');if(n!=c)return toast('التأكيد غير مطابق');if(D.pf.pwh&&await sha(o.value)!=D.pf.pwh)return toast('كلمة المرور الحالية غير صحيحة');D.pf.pwh=await sha(n);D.pf.pwd=Date.now();OK=1;save();toast('تم حفظ كلمة المرور');go()}
async function lgn(){const u=$('#loginuser');if(u&&u.value.trim()&&u.value.trim()!==String(D.pf.user||'')&&u.value.trim()!==String(D.pf.lph||D.pf.phone||''))return toast('اسم المستخدم أو رقم الهاتف غير صحيح');if(await sha($('#lp').value)==D.pf.pwh){OK=1;go('home')}else toast('كلمة المرور غير صحيحة')}
function banks(){return hd('الحسابات البنكية','تظهر للعميل في صفحة الدفع الخاصة بمكتبك',`<button class="bt g" onclick="be()">+ حساب جديد</button>`)+`<div class="card">${D.bk.map(b=>`<div class="row" style="cursor:default"><div class="ia">${b.ty=='بنك'?'🏦':'📱'}</div><div class="rm"><b>${h(b.n)} <span class="pl">${b.ty}</span></b><small>${h(b.no)} · ${h(b.ho)||'بدون اسم صاحب الحساب'} · ${b.cur}</small></div><label class="tg"><input type="checkbox" ${b.on?'checked':''} onchange="D.bk.find(x=>x.id==${b.id}).on=this.checked?1:0;save()"><i></i></label><button class="ib" onclick="be(${b.id})">✎</button><button class="ib" onclick="D.bk=D.bk.filter(x=>x.id!=${b.id});save();go()">🗑</button></div>`).join('')||'<p class="em">أضف أول حساب</p>'}</div>`}
function be(id){const b=id?D.bk.find(x=>x.id==id):{ty:'بنك',cur:'USD'},o=(a,v)=>a.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('');
mo(id?'تعديل الحساب':'حساب جديد',`<div class="fg"><div><label>النوع</label><select id="b_ty">${o(['بنك','محفظة'],b.ty)}</select></div><div><label>الاسم</label><input id="b_n" value="${h(b.n)}"></div><div><label>رقم الحساب / المحفظة</label><input id="b_no" value="${h(b.no)}"></div><div><label>اسم صاحب الحساب</label><input id="b_ho" value="${h(b.ho)}"></div><div><label>العملة</label><select id="b_cur">${o(['USD','SAR','YER'],b.cur)}</select></div></div>`,`bs(${id||0})`)}
function bs(id){const v=k=>$('#b_'+k).value.trim(),b=id?D.bk.find(x=>x.id==id):{id:Date.now(),on:1};if(!v('n')||!v('no'))return toast('اكتب الاسم ورقم الحساب');Object.assign(b,{ty:v('ty'),n:v('n'),no:v('no'),ho:v('ho'),cur:v('cur')});if(!id)D.bk.push(b);save();cm();go()}
function ex(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='safarak-office-data.json';a.click()}
function im(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.ofr||!d.ord)throw 0;D=d;mig();save();toast('تم الاستيراد');go('home')}catch(e){toast('الملف غير صالح')}};r.readAsText(f)}

let REGFILES={};
function regPreview(inp,key){const f=inp.files&&inp.files[0];if(!f)return;if(f.size>4*1024*1024){toast('حجم الصورة كبير، اختر صورة أقل من 4 ميجابايت');inp.value='';return}const rd=new FileReader();rd.onload=()=>{REGFILES[key]=rd.result;const n=document.getElementById(inp.id+'_n'),b=document.getElementById(inp.id+'_b');if(n)n.textContent='تم اختيار: '+f.name;if(b)b.classList.add('on')};rd.readAsDataURL(f)}
async function regsave(){
 const g=i=>$('#'+i).value.trim(),name=g('r_name'),owner=g('r_owner'),phone=g('r_phone'),addr=g('r_addr'),cr=g('r_cr'),oid=g('r_oid');

}
